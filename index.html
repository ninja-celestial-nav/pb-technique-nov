<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Paddle Review · Technique Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700;1,900&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F0E7;--ink:#161513;--red:#A3311D;--redl:#E58B76;--mute:#6a645a;--soft:#E9E3D3;
--serif:'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif;--disp:'Playfair Display',Georgia,'Times New Roman','Noto Serif TC',serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.dark :focus-visible{outline-color:var(--redl)}
[tabindex="-1"]:focus{outline:none}
a{text-underline-offset:3px;text-decoration-thickness:1px}
.ico{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
ul{list-style:none}

/* chrome */
.top{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:18px;padding:0 24px;background:var(--paper);border-bottom:1px solid var(--ink);z-index:30}
.brand{display:inline-flex;align-items:center;gap:.26em;min-height:44px;font-family:var(--disp);font-weight:700;font-size:19px;white-space:nowrap;cursor:pointer;text-decoration:none}
.brand i,.mast h1 i{color:var(--red);font-style:italic}
.issue{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{display:flex;align-items:center;gap:10px}
.btn{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--ink);padding:5px 11px;border-radius:2px;line-height:1.3;text-decoration:none;white-space:nowrap;color:inherit}
.btn:hover{background:var(--ink);color:var(--paper)}
.pill{background:var(--red);color:#fff;border-color:var(--red);border-radius:99px}
.pill:hover{background:#7f2515;border-color:#7f2515;color:#fff}
.short{display:none}
.top .btn{min-height:34px;display:inline-flex;align-items:center;justify-content:center}
.prog{position:fixed;top:52px;left:0;right:0;height:2px;z-index:30}
.prog b{display:block;height:2px;background:var(--red);width:0;transition:width .3s}
main,#fxw{position:fixed;inset:54px 0 46px 0}
/* WebGPU overlay (transparent canvas above the page; the page keeps its own paper/ink background) */
main{z-index:1}
#fxw{z-index:2;pointer-events:none}
#fx{display:block;width:100%;height:100%;pointer-events:none}
.slide{display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#bdb4a2 transparent}
.slide.on{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:38px 32px 80px}
.folio{position:fixed;inset:auto 0 0 0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-top:1px solid var(--ink);background:var(--paper);z-index:30;font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.folio button{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:44px}
.folio button:disabled{opacity:.25;cursor:default}
.folio span{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* type */
.mod .h1{word-break:keep-all;overflow-wrap:anywhere}
.hno{font-family:var(--disp);font-style:italic;font-weight:700;color:var(--red);margin-right:.08em}
.h1{font-weight:900;font-size:clamp(30px,4.4vw,56px);line-height:1.15;letter-spacing:-.005em;text-wrap:balance}
html.en .h1{font-family:var(--disp);line-height:1.08;letter-spacing:-.015em}
.deck{font-size:18px;color:#3b372f;margin:16px 0 0;max-width:33em}
.sec{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:34px 0 0}
.sec.first{margin-top:0}
.notes li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--ink);font-size:16px}
.notes li span:first-child{font-family:var(--mono);color:var(--red)}
.fault{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin-top:28px}
.fault>div{padding:14px 18px}
.fault>div+div{border-left:1px solid var(--ink)}
.fault b{display:block;font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:500;margin-bottom:4px}
.fault p{font-size:15px;line-height:1.65}
.mod{display:grid;grid-template-columns:1.05fr .95fr;gap:0 52px}
.vid{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;padding:16px 0;border-bottom:1px solid var(--ink)}
.vn{font-family:var(--disp);font-style:italic;font-weight:700;font-size:34px;line-height:1;color:var(--red)}
.vch{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.vt{font-family:var(--disp);font-style:italic;font-weight:500;font-size:19px;line-height:1.3;margin:3px 0 6px}
.vid p{font-size:14.5px;line-height:1.65;color:#3b372f}
.vl{display:inline-flex;align-items:center;min-height:44px;margin-top:2px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--red);text-decoration:underline;text-underline-offset:3px}
.fact{background:var(--soft);border-left:3px solid var(--red);padding:16px 20px;margin-top:28px;font-size:15px}
.fact b{display:block;font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:500;margin-bottom:4px}
.fact p{line-height:1.7}
.src{font-family:var(--mono);font-size:13px;line-height:1.8;color:var(--mute);margin-top:10px}
.src a{color:var(--mute)}
.feature{background:var(--ink);color:var(--paper);padding:24px 28px;margin-top:28px}
.feature h3{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.4;margin-bottom:10px}
html.en .feature h3{font-family:var(--disp)}
.feature ol{list-style:none;counter-reset:f}
.feature li{counter-increment:f;display:flex;gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid #4a463e;font-size:15.5px}
.feature li::before{content:counter(f);font-family:var(--disp);font-style:italic;font-weight:700;font-size:24px;color:var(--redl);min-width:22px}
.feature .src,.feature .src a{color:#b9b3a5}

/* cover */
.mast{text-align:center;border-bottom:3px double var(--ink);padding-bottom:20px;margin-bottom:30px}
.mast h1{font-family:var(--disp);font-weight:900;font-size:clamp(46px,9.4vw,116px);line-height:1;letter-spacing:-.02em}
.issueline{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.cgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:0 54px}
.lede{margin-top:22px;font-size:17px;max-width:36em}
.dropcap::first-letter{float:left;font-family:var(--disp);font-weight:900;font-size:4.2em;line-height:.82;padding:.05em .1em 0 0;color:var(--red)}
.lines{margin-top:26px}
.cl{display:grid;grid-template-columns:48px 1fr auto;align-items:baseline;gap:8px;padding:11px 0;min-height:48px;border-top:1px solid var(--ink);cursor:pointer;text-decoration:none}
.cl:last-child{border-bottom:1px solid var(--ink)}
.cl i{font-family:var(--disp);font-style:italic;font-weight:700;color:var(--red);font-size:22px}
.cl span{font-weight:600}
.cl em{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--mute)}
.cl:hover span{color:var(--red)}
.card{border:1px solid var(--ink);padding:20px 22px;margin-bottom:22px;background:rgba(255,255,255,.4)}
.card h3{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--mute);margin-bottom:8px}
.codebig{font-family:var(--mono);font-weight:500;font-size:42px;letter-spacing:.16em;color:var(--red);line-height:1.1}
.card p{font-size:14.5px;line-height:1.65;margin:8px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.disc{font-family:var(--mono);font-size:13px;line-height:1.65;color:var(--mute)}
.note{border-top:1px solid var(--ink);margin-top:24px;padding-top:12px}

/* gear */
.gear{display:grid;grid-template-columns:1fr 1fr;gap:0 52px;margin-top:8px}
.pad{border-top:2px solid var(--ink);padding:18px 0 26px}
.pad h3{font-family:var(--disp);font-weight:900;font-size:26px;line-height:1.2}
.pad .tag{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:4px 0 8px}
.spec{display:grid;grid-template-columns:82px 1fr;gap:4px 14px;font-size:14.5px;line-height:1.6;margin:10px 0}
.spec dt{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.coderow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px 12px;border:1px dashed var(--ink)}
.coderow b{font-family:var(--mono);font-weight:500;letter-spacing:.14em;color:var(--red)}
.pull{font-family:var(--serif);font-weight:700;font-size:clamp(22px,3vw,34px);line-height:1.4;border-left:4px solid var(--red);padding:4px 0 4px 22px;margin:34px 0 8px}
html.en .pull{font-family:var(--disp);font-style:italic;font-weight:500}
.pullby{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-left:26px}

/* corner (dark) */
.slide.dark{background:var(--ink);color:var(--paper);scrollbar-color:#4a463e transparent}
.dark .pullby{color:#b9b3a5}
.dark .deck{color:#cfc9ba}
.dark .sec{border-color:var(--paper)}
.dark .btn{border-color:var(--paper)}
.dark .btn:hover{background:var(--paper);color:var(--ink)}
.dark .pill{background:var(--red);border-color:var(--red)}
.dark .disc,.dark .src,.dark .src a{color:#b9b3a5}
.cgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 54px;margin-top:26px}
.price{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--paper);margin:12px 0}
.price div{padding:16px 10px;text-align:center}
.price div+div{border-left:1px solid var(--paper)}
.price small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#b9b3a5}
.price strong{display:block;font-family:var(--disp);font-weight:900;font-size:30px;line-height:1.2}
.dark ul.plain li{padding:9px 0;border-top:1px solid #4a463e;font-size:15px;display:flex;gap:12px}
.dark ul.plain li span:first-child{font-family:var(--mono);color:var(--redl);flex:none;min-width:3.4em}
.drill{padding:12px 0;border-top:1px solid #4a463e}
.drill b{display:block;font-weight:700;font-size:16px}
.drill p{font-size:14.5px;line-height:1.65;color:#cfc9ba}
.dark .codewrap{border:1px solid var(--paper);padding:18px 20px;margin-top:20px}
.dark .codebig{color:var(--redl)}
.srcs{columns:2;column-gap:40px;font-family:var(--mono);font-size:13px;line-height:1.7;color:#b9b3a5;margin-top:10px}
.srcs a{display:block;margin-bottom:4px;break-inside:avoid;color:#b9b3a5}

/* toc */
.toc{position:fixed;inset:0;background:var(--paper);z-index:50;display:none;overflow:auto;padding:70px 32px 40px}
.toc.on{display:block}
.toc .in{max-width:760px;margin:0 auto}
.toc .x{position:fixed;top:12px;right:20px}
.toc a{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:baseline;padding:12px 0;border-top:1px solid var(--ink);text-decoration:none;cursor:pointer;font-weight:600;font-size:19px}
.toc a:last-child{border-bottom:1px solid var(--ink)}
.toc a i{font-family:var(--disp);font-style:italic;font-weight:700;color:var(--red)}
.toc a em{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--mute);font-weight:400}
.toc a:hover{color:var(--red)}
.toch{font-family:var(--disp);font-weight:900;font-size:clamp(28px,4vw,40px);line-height:1.1;margin-bottom:18px}
.toc a[aria-current="page"]{color:var(--red)}
.toc a[aria-current="page"] em::after{content:' · 目前'}
html.en .toc a[aria-current="page"] em::after{content:' · current'}

/* page endings */
.endrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,400px);gap:18px 40px;align-items:center;margin-top:52px;padding-top:22px;border-top:2px solid var(--ink)}
.endrow.solo{grid-template-columns:minmax(280px,400px);justify-content:end}
.invite{font-size:17px;line-height:1.65;max-width:34em}
.invite a{color:var(--red);font-weight:600}
.nextp{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px;padding:14px 20px;border:1px solid var(--ink);text-decoration:none}
.nextp small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.nextp strong{display:block;font-size:21px;font-weight:700;line-height:1.3}
html.en .nextp strong{font-family:var(--disp)}
.nextp strong i{font-family:var(--disp);font-style:italic;color:var(--red);margin-right:.15em}
.nextp .ico{flex:none;width:26px;height:26px}
.nextp:hover{background:var(--ink);color:var(--paper)}
.nextp:hover small{color:#cfc9ba}
.nextp:hover strong i{color:var(--redl)}

/* court diagram */
.court{margin-top:30px}
.court svg.map{display:block;width:100%;max-width:440px;height:auto;margin-top:14px}
.legend{margin-top:10px}
.legend li{display:flex;gap:12px;align-items:baseline;padding:5px 0;font-size:15.5px;line-height:1.6}
.legend .sw{flex:none;width:34px;height:10px}

/* coach's corner offer */
.btn.big{display:inline-flex;align-items:center;min-height:52px;padding:12px 26px;font-size:16px;letter-spacing:.02em;margin-top:24px}
.alt{margin-top:14px;font-size:15.5px;color:#cfc9ba}
.alt a{color:var(--paper)}

@media (max-width:820px){
 .wrap{padding:24px 18px 70px}
 .top{padding:0 14px;gap:10px}
 .brand{font-size:16px}
 .issue{display:none}
 .top nav{margin-left:auto;gap:8px}
 .long{display:none}.short{display:inline-flex;align-items:center}
 .top .btn,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:8px 13px}
 main,#fxw{bottom:52px}
 .folio{height:52px}
 .src a{display:inline-flex;align-items:center;min-height:44px}
 .srcs a{display:flex;align-items:center;min-height:44px;margin:0}
 .fault p,.fact,.vid p,.drill p,.card p{font-size:16px}
 .endrow,.endrow.solo{grid-template-columns:1fr;margin-top:40px}
 .btn.big{width:100%;justify-content:center}
 .mod,.cgrid,.gear,.cgrid2{grid-template-columns:1fr}
 .fault{grid-template-columns:1fr}
 .fault>div+div{border-left:0;border-top:1px solid var(--ink)}
 .codebig{font-size:34px}
 .price strong{font-size:24px}
 .srcs{columns:1}
 .folio{padding:0 8px}
 .deck{font-size:16.5px}
 .toc{padding:64px 18px 30px}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#1" data-go="1">The Paddle <i>Review</i></a>
  <span class="issue" id="issue"></span>
  <nav>
    <button class="btn" id="lang" aria-label="Language"></button>
    <button class="btn" id="tocBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="toc"></button>
    <a class="btn pill" id="book" href="https://ninjapb.vercel.app/" target="_blank" rel="noopener"></a>
  </nav>
</header>
<div class="prog"><b id="bar"></b></div>
<main id="slides"></main>
<div id="fxw" aria-hidden="true"><canvas id="fx"></canvas></div>
<footer class="folio">
  <button id="prev" aria-label="上一頁"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
  <span id="fol" aria-live="polite" aria-atomic="true"></span>
  <button id="next" aria-label="下一頁"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>
</footer>
<div class="toc" id="toc" role="dialog" aria-modal="true" aria-labelledby="tocH"></div>

<script>
/* ---------- language ---------- */
var lang = 'zh';
function detect(){
  var q = (location.search.match(/[?&]lang=(en|zh)/) || [])[1];
  if (q) return q;
  try { var s = localStorage.getItem('pr_lang'); if (s === 'en' || s === 'zh') return s; } catch (e) {}
  var ls = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'zh'];
  for (var i = 0; i < ls.length; i++) { if (/^zh/i.test(ls[i])) return 'zh'; }
  return 'en';
}
function T(a){ return a[lang === 'zh' ? 0 : 1]; }

/* ---------- constants ---------- */

var DM = 'https://ig.me/m/ninjapbtw';
var IG = 'https://www.instagram.com/ninjapbtw/';

var UI = {

  next: ['下一個技術', 'Next technique'],
  nextPage: ['下一頁', 'Next page'],
  start: ['開始閱讀', 'Start reading'],
  coach: ['教練提示', "Coach's notes"],
  fault: ['常見盲點', 'Common fault'],
  fix: ['矯正', 'Fix'],
  watch: ['延伸觀看', 'Watch'],
  open: ['在 YouTube 觀看 ↗', 'Watch on YouTube ↗'],
  copy: ['複製折扣碼', 'Copy code'],

  buy: ['前往購買 ↗', 'Shop ↗'],
  close: ['關閉目錄', 'Close contents']
};

/* ---------- video helper ---------- */
function V(id, ch, t, zh, en){ return {id: id, ch: ch, t: t, c: [zh, en]}; }

/* ---------- modules ---------- */
var MODS = [
{ no: 'I', nav: ['發球', 'Serve'],
  h: ['發球：深度先於旋轉，旋轉先於速度', 'Serve: depth before spin, spin before speed'],
  deck: ['發球的第一個任務，是不要送給對手一顆好球。先求合法，再求深，最後才談變化。', 'The first job of a serve is to not hand your opponent an easy ball. Make it legal, then deep, then worry about variety.'],
  notes: [
    ['深度優先：把球壓在對手底線附近，回發球的人就很難直接衝上網。', 'Depth first: a deep serve makes it hard for the returner to rush the net.'],
    ['放鬆的鐘擺揮拍，靠下肢與轉髖帶動，不要靠手腕甩拍。', 'A relaxed pendulum swing driven by the legs and hips, not a wrist flick.'],
    ['拋球與擊球點固定，比花式發球更能減少失誤。', 'A repeatable toss and contact point beat fancy serves for consistency.'],
    ['發球後保持平衡，立刻準備第三拍，不要站在原地看球。', 'Stay balanced after the serve and get ready for the third shot instead of watching the ball.']
  ],
  mis: ['拋球離身體太近，手腕被迫翻勾。', 'The toss is too close to the body, which forces a wrist flick.'],
  fix: ['拋球稍微往前；發球後補上一步、站穩，準備第三拍。', 'Toss slightly in front; after the serve take a step in, get set, and prepare for the third shot.'],
  vids: [
    V('L0tXZgYI2R0', 'Briones Pickleball Academy', 'Stop Serving Like An Amateur (Add These To Your Game)',
      '三種發球：力量發球、高吊發球與強側旋發球。重點在深度、重心轉移與避免過大的引拍。',
      'Three serves: a power serve, a lob serve and a heavy sidespin serve, with emphasis on depth, weight transfer and a short backswing.'),
    V('x9DwZoUI988', 'Ty Butson', 'Get FREE Points In Pickleball | 2026 Serve Strategy',
      '發球戰術與落點。影片依序分為核心策略、技術、落點與實戰示範。',

    '<marker id="arK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 9 5 0 9z" fill="' + INK + '"/></marker></defs>' +
    '<rect x="74" y="30" width="252" height="360" fill="#E9E3D3"/>' +
    '<rect x="20" y="30" width="360" height="360" fill="none" stroke="' + INK + '" stroke-width="1.5"/>' +
    '<path d="M74 30V390M326 30V390" stroke="' + INK + '" stroke-width="1.5"/>' +
    '<path d="M20 210H74M326 210H380" stroke="' + INK + '" stroke-width="1"/>' +
    '<path d="M200 18V402" stroke="' + INK + '" stroke-width="3"/>' +
    '<circle cx="200" cy="18" r="4" fill="' + INK + '"/><circle cx="200" cy="402" r="4" fill="' + INK + '"/>' +
    '<path d="M68 304H280" fill="none" stroke="' + INK + '" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arK)"/>' +
    '<path d="M68 296 282 120" fill="none" stroke="' + RED + '" stroke-width="2.6" marker-end="url(#arR)"/>' +
    '<circle cx="56" cy="300" r="9" fill="' + INK + '"/>' +
    '<circle cx="344" cy="120" r="9" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="1.8"/>' +
    lab(208, 22, T(['邊線處 36 吋', 'Sideline 36 in'])) +
    lab(208, 228, T(['中央 34 吋', 'Center 34 in'])) +
    lab(137, 374, T(['廚房 · 7 呎', 'Kitchen · 7 ft']), 'middle') +
    lab(263, 374, T(['廚房', 'Kitchen']), 'middle') +
    lab(56, 324, T(['你', 'You']), 'middle') +
    lab(344, 96, T(['對手', 'Opponent']), 'middle') +
    '</svg>';
  var sw = function(dash, color, w){
    return '<svg class="sw" viewBox="0 0 34 10" aria-hidden="true"><path d="M2 5H32" stroke="' + color + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="6 5"' : '') + '/></svg>';
  };
  return '<figure class="court"><figcaption class="sec first">' + T(['丁克的站位與落點', 'Where to stand, where to land']) + '</figcaption>' + svg +
    '<ul class="legend"><li>' + sw(false, RED, 2.6) + '<span>' + T(['對角線丁克：從球網中段過網，那裡比邊線處低 2 吋，球的飛行距離也比較長。', 'Cross-court dink: it crosses the middle of the net, 2 inches lower than at the sidelines, and travels farther.']) + '</span></li>' +
    '<li>' + sw(true, INK, 1.6) + '<span>' + T(['直線丁克：在靠近邊線、較高的網段過網。', 'Straight dink: it crosses the higher stretch of net near the sideline.']) + '</span></li></ul>' +
    '<p class="src">' + T(['比例依 USA Pickleball 規格：球場寬 20 呎、廚房 7 呎、網高邊線處 36 吋、中央 34 吋；圖中只畫出網前各 10 呎。', 'Drawn to USA Pickleball dimensions: a 20 ft wide court, a 7 ft kitchen, and a net 36 in high at the sidelines and 34 in at the center. Only the 10 ft either side of the net is shown.']) +

}

function toc(){
  var rows = [['', T(['封面', 'Cover']), 1]];
  MODS.forEach(function(m, i){ rows.push([m.no, T(m.nav), i + 2]); });
  rows.push(['IX', T(['裝備筆記', 'Gear notes']), MODS.length + 2]);
  rows.push(['X', "Coach's Corner", MODS.length + 3]);
  return '<button class="btn x" id="tocX">' + T(UI.close) + '</button><div class="in"><h2 class="toch" id="tocH">' + T(UI.toc) + '</h2>' +
    rows.map(function(r){ return '<a href="#' + r[2] + '" data-go="' + r[2] + '"><i>' + r[0] + '</i><span>' + r[1] + '</span><em>p.' + pad2(r[2]) + '</em></a>'; }).join('') + '</div>';
}

function pageName(n){
  if (n === 1) return T(['封面', 'Cover']);
  if (n <= MODS.length + 1) return T(MODS[n - 2].nav);
  if (n === MODS.length + 2) return T(['裝備筆記', 'Gear notes']);
  return "Coach's Corner";
}

function render(){
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
  document.documentElement.className = lang === 'en' ? 'en' : '';
  document.title = 'The Paddle Review · ' + T(['技術特輯', 'Technique Edition']);
  $('issue').textContent = T(UI.issue);
  $('lang').textContent = lang === 'zh' ? 'EN' : '中';
  $('lang').setAttribute('aria-label', T(['切換為英文', 'Switch to Chinese']));
  $('tocBtn').setAttribute('aria-label', T(UI.toc));
  $('tocBtn').innerHTML = '<span class="long">' + T(UI.toc) + '</span><span class="short"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg></span>';
  $('prev').setAttribute('aria-label', T(['上一頁', 'Previous page']));
  $('next').setAttribute('aria-label', T(['下一頁', 'Next page']));
  $('book').innerHTML = '<span class="long">' + T(UI.book) + '</span><span class="short">' + T(['預約課程', 'Book']) + '</span>';
  var s = cover() + MODS.map(mod).join('') + gear() + corner();
  $('slides').innerHTML = s;
  $('toc').innerHTML = toc();
  go(cur, 'replace');
}

/* ---------- navigation ---------- */
function go(n, how, focusHead){
  n = Math.max(1, Math.min(N, parseInt(n, 10) || 1));
  cur = n;
  var all = document.querySelectorAll('.slide');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
  var el = $('s' + n);
  if (el){ el.classList.add('on'); el.scrollTop = 0; }
  var fxm = n === 1 ? 'cover' : (el && el.classList.contains('dark') ? 'dark' : 'plain');
  document.body.setAttribute('data-fx', fxm);
  try { if (window.PR_FX) window.PR_FX.set(fxm); } catch (e) {}
  $('fol').textContent = pad2(n) + ' / ' + pad2(N) + ' · ' + pageName(n);
  $('bar').style.width = (n / N * 100) + '%';
  $('prev').disabled = n === 1;
  $('next').disabled = n === N;
  closeToc(false);
  try {
    if (how === 'replace') history.replaceState(null, '', '#' + n);
    else if (how !== 'pop' && location.hash !== '#' + n) history.pushState(null, '', '#' + n);
  } catch (e) {}
  if (focusHead && el){
    var hd = el.querySelector('h1, h2');
    if (hd){ hd.setAttribute('tabindex', '-1'); try { hd.focus({preventScroll: true}); } catch (e) { hd.focus(); } }
  }
}

function setInert(on){
  [document.querySelector('.top'), $('slides'), document.querySelector('.folio')].forEach(function(x){
    if (!x) return;
    if (on) x.setAttribute('inert', ''); else x.removeAttribute('inert');
  });
}
function openToc(){
  var t = $('toc');
  var links = t.querySelectorAll('a[data-go]');
  for (var i = 0; i < links.length; i++){
    if (parseInt(links[i].getAttribute('data-go'), 10) === cur) links[i].setAttribute('aria-current', 'page');
    else links[i].removeAttribute('aria-current');
  }
  t.classList.add('on');
  $('tocBtn').setAttribute('aria-expanded', 'true');
  setInert(true);
  var c = t.querySelector('[aria-current]') || t.querySelector('a, button');
  if (c) c.focus();
}
function closeToc(restore){
  var t = $('toc');
  if (!t || !t.classList.contains('on')) return;
  t.classList.remove('on');
  $('tocBtn').setAttribute('aria-expanded', 'false');
  setInert(false);
  if (restore) $('tocBtn').focus();
}

function setLang(l){
  lang = l;
  try { localStorage.setItem('pr_lang', l); } catch (e) {}
  render();
}

function copy(txt, btn){
  var done = function(){
    btn.textContent = T(UI.copied);
    setTimeout(function(){ btn.textContent = T(UI.copy); }, 1600);
  };
  var fallback = function(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done();
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, fallback); return; }
  } catch (e) {}
  fallback();
}

document.addEventListener('click', function(e){
  var t = e.target;
  var el = t.closest ? t.closest('[data-go]') : null;
  if (el){ e.preventDefault(); go(el.getAttribute('data-go'), 'push', true); return; }
  el = t.closest ? t.closest('[data-copy]') : null;
  if (el){ copy(el.getAttribute('data-copy'), el); return; }
  if (t.closest && t.closest('#lang')){ setLang(lang === 'zh' ? 'en' : 'zh'); return; }
  if (t.closest && t.closest('#tocBtn')){ openToc(); return; }
  if (t.closest && t.closest('#tocX')){ closeToc(true); return; }
  if (t.closest && t.closest('#prev')){ go(cur - 1, 'push'); return; }
  if (t.closest && t.closest('#next')){ go(cur + 1, 'push'); return; }
});
document.addEventListener('keydown', function(e){
  if ($('toc').classList.contains('on')){
    if (e.key === 'Escape'){ e.preventDefault(); closeToc(true); }
    else if (e.key === 'Tab'){
      var f = $('toc').querySelectorAll('a[href], button');
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') go(cur + 1, 'push');
  else if (e.key === 'ArrowLeft') go(cur - 1, 'push');
});
function fromHash(){
  var n = parseInt((location.hash || '').slice(1), 10);
  if (n && n !== cur) go(n, 'pop', true);
}
window.addEventListener('popstate', fromHash);
window.addEventListener('hashchange', fromHash);

lang = detect();
render();
</script>
